name: CI

on:
  pull_request:
  push:
    # `features` is where day-to-day work lands; auto-merge.yml only promotes a
    # features commit to main after CI has passed on that exact commit.
    branches: [main, features]
  schedule:
    # Safety net independent of push/PR frequency — fires ~3x/day on main only.
    # Scheduled workflows never run on forks, so this is effectively owner-only.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, check, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run repository quality gates
        run: ./scripts/ci.sh

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies
        run: cargo audit

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject accidental large files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find . -type f -not -path './.git/*' -size +10M -print)"
          if [ -n "$bad" ]; then
            echo "Large files found:"
            echo "$bad"
            exit 1
          fi
      - name: Check for common secret files
        shell: bash
        run: |
          set -euo pipefail
          for f in .env .env.local .env.production; do
            if [ -e "$f" ]; then
              echo "Forbidden secret file present: $f"
              exit 1
            fi
          done

  tsc-drift:
    name: Compare against real tsc (false-positive gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build ts-rust (release)
        run: cargo build --release --bin ts-rust
      - name: Install ts-diag-tool dependencies
        working-directory: scripts/ts-diag-tool
        run: npm ci
      - name: Compare ts-rust against real tsc over tests/fixtures
        # Informational by design: many fixtures deliberately diverge from
        # tsc on purpose (this checker's own recovery behavior -- see
        # bin/compare-tsc.rs's module doc comment), so this step's own exit
        # code is never checked. What's gated is only the false-positive
        # count, via check-baseline.js in the next step.
        run: |
          node scripts/ts-diag-tool/compare.js tests/fixtures target/release/ts-rust --json --only-differs \
            > /tmp/tsc-drift-result.json || true
      - name: Enforce false-positive baseline
        run: node scripts/ts-diag-tool/check-baseline.js < /tmp/tsc-drift-result.json

      # Same-as-main gate: build main's checker, run it over THIS commit's
      # fixtures, and require that this commit's checker agrees with real tsc
      # at least as well as main's does. Both binaries see identical fixtures, so
      # any difference comes from the checker code, not from the fixtures.
      - name: Check out main for comparison
        if: github.ref != 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - name: Build main's ts-rust (release)
        if: github.ref != 'refs/heads/main'
        run: cargo build --release --bin ts-rust --manifest-path main-src/Cargo.toml
      - name: Compare main's ts-rust against real tsc over the same fixtures
        if: github.ref != 'refs/heads/main'
        run: |
          node scripts/ts-diag-tool/compare.js tests/fixtures main-src/target/release/ts-rust --json \
            > /tmp/tsc-drift-main.json || true
      - name: Fail if this commit is worse than main
        if: github.ref != 'refs/heads/main'
        run: |
          node -e '
            const fs = require("fs");
            const here = JSON.parse(fs.readFileSync("/tmp/tsc-drift-result.json", "utf8")).summary;
            const main = JSON.parse(fs.readFileSync("/tmp/tsc-drift-main.json", "utf8")).summary;
            console.log("false positives  main:", main.falsePositive, " this commit:", here.falsePositive);
            if (here.falsePositive > main.falsePositive) {
              console.error("FAIL: this commit has more false positives than main.");
              process.exit(1);
            }
          '
